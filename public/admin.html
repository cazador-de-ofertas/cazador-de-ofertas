<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crear oferta</title><style>*{box-sizing:border-box}body{margin:0;background:#ffd500;font-family:Arial;padding:20px}.box{max-width:600px;margin:auto;background:#111;color:#fff;border-radius:22px;padding:28px}img{width:90px;border-radius:50%;display:block;margin:auto}h1{text-align:center}label{display:block;margin-top:15px;font-weight:bold}input,textarea,button{width:100%;padding:14px;margin-top:7px;border-radius:10px;border:0;font-size:16px}button{margin-top:18px;background:#ffd500;font-weight:900}.result{display:none;background:#222;padding:15px;margin-top:20px;border-radius:10px;word-break:break-all}</style></head><body><div class="box"><img src="/logo.png"><h1>🕵️‍♂️ Crear oferta</h1><label>Link de afiliado *</label><input id="url" placeholder="https://..."><label>Nombre *</label><input id="title" placeholder="Combo GAMA..."><label>Precio</label><input id="price" placeholder="$87.999"><label>Descuento</label><input id="discount" placeholder="45% OFF"><label>Precio anterior</label><input id="old" placeholder="$159.998"><label>Imagen pública HTTPS *</label><input id="image" placeholder="https://...jpg"><label>Descripción</label><textarea id="desc" placeholder="🔥 45% OFF · Oferta por tiempo limitado"></textarea><label>Código corto (opcional)</label><input id="slug" placeholder="gama45"><button onclick="crear()">CREAR LINK</button><div id="result" class="result"><b>¡Listo! 🚀</b><p id="out"></p><button onclick="copiar()">COPIAR</button></div></div><script>
const clean=s=>s.toLowerCase().trim().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
async function crear(){let key=localStorage.getItem('adminKey')||prompt('ADMIN_KEY:');if(!key)return;localStorage.setItem('adminKey',key);let b={url:url.value.trim(),title:title.value.trim(),price:price.value.trim(),discount:discount.value.trim(),oldPrice:old.value.trim(),image:image.value.trim(),description:desc.value.trim(),slug:clean(slug.value)};if(!/^https?:\/\//i.test(b.url)||!b.title||!/^https:\/\//i.test(b.image)){alert('Completá link de afiliado, nombre e imagen HTTPS.');return}let x=await fetch('/api/create',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(b)}),d=await x.json();if(!x.ok){alert(d.error||'Error');return}out.textContent=location.origin+'/meli.la/'+d.slug;result.style.display='block'}function copiar(){navigator.clipboard.writeText(out.textContent).then(()=>alert('¡Copiado!'))}</script></body></html>
